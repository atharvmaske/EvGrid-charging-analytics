evgrid_postgres:
  target: docker

  outputs:
    local:
      type: postgres
      host: localhost
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'evgrid') }}"
      schema: public
      threads: 4

    docker:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'evgrid') }}"
      schema: public
      threads: 4

    ci:
      type: postgres
      host: "{{ env_var('DBT_TARGET_HOST', 'localhost') }}"
      port: 5432
      user: evgrid
      password: "{{ env_var('POSTGRES_PASSWORD', 'evgrid') }}"
      dbname: evgrid
      schema: public
      threads: 4