name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements/dev.txt

      - run: pytest -q

  dbt:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: evgrid
          POSTGRES_PASSWORD: evgrid
          POSTGRES_DB: evgrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evgrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: evgrid
      POSTGRES_PASSWORD: evgrid
      DBT_TARGET_HOST: localhost
      DBT_PROFILES_DIR: dbt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dbt.txt

      - name: Install dbt
        run: pip install -r requirements/dbt.txt

      - name: Seed minimal bronze tables
        run: psql -h localhost -U evgrid -d evgrid -v ON_ERROR_STOP=1 -f dbt/ci/seed_ci.sql

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt parse
        working-directory: dbt
        run: dbt parse --target ci

      - name: Create infra indexes
        run: psql -h localhost -U evgrid -d evgrid -v ON_ERROR_STOP=1 -f dbt/setup_indexes.sql

      - name: dbt build (seed + run + test)
        working-directory: dbt
        run: dbt build --target ci
    api-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-fastapi.txt

      - name: Install FastAPI dependencies
        run: pip install -r requirements-fastapi.txt

      - name: Import FastAPI app (same layout as the container)
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          GEMINI_API_KEY: ci-dummy
        run: |
          # Mirror docker-compose's /app layout: api/, fastapi_project/ (-> fastapi/), config/, core/.
          mkdir -p "$RUNNER_TEMP/pp"
          ln -sfn "$GITHUB_WORKSPACE/api" "$RUNNER_TEMP/pp/api"
          ln -sfn "$GITHUB_WORKSPACE/fastapi" "$RUNNER_TEMP/pp/fastapi_project"
          ln -sfn "$GITHUB_WORKSPACE/config" "$RUNNER_TEMP/pp/config"
          ln -sfn "$GITHUB_WORKSPACE/core" "$RUNNER_TEMP/pp/core"
          export PYTHONPATH="$RUNNER_TEMP/pp"
          python -c "
          import types
          import sqlalchemy

          sqlalchemy.create_engine = lambda *a, **k: types.SimpleNamespace(
              connect=lambda: None
          )

          from api.main import app
          print('OK: api.main (production entrypoint) imports cleanly, all routers loaded.')
          "


  airflow-dag-import:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Apache Airflow (with constraints)
        run: |
          AIRFLOW_VERSION=2.10.1
          PYTHON_VERSION=3.12
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install -r requirements/airflow.txt --constraint "${CONSTRAINT_URL}"

      - name: Verify DAG imports
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          # config/ at repo root; adjust if utils/ lives elsewhere (e.g. airflow/plugins)
          PYTHONPATH: .:airflow:airflow/plugins
        run: |
          python -c "
          from airflow.models import DagBag

          bag = DagBag(dag_folder='airflow/dags', include_examples=False)

          if bag.import_errors:
              for file, error in bag.import_errors.items():
                  print(f'IMPORT ERROR in {file}:\n{error}')
              raise SystemExit(1)

          print(f'OK: {len(bag.dags)} DAGs imported cleanly.')
          print(list(bag.dags.keys()))
          "